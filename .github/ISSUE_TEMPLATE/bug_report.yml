name: Reportar um problema
description: Registar uma falha funcional não sensível da STAND
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Não usar este formulário para vulnerabilidades, credenciais, dados pessoais, evidências ou dados de projetos.**
        Consulte SECURITY.md e comunique esses casos pelo canal interno de segurança.
  - type: textarea
    id: summary
    attributes:
      label: Resumo do problema
      description: Explique o comportamento observado sem incluir informação sensível.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos de reprodução
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Fichas semanais
        - DCAPE / Timeline
        - RDCD / reporting
        - KPI / resíduos
        - Operação SIN01 / NEST
        - Gestão de utilizadores / permissões
        - Integração / infraestrutura
        - Outra
    validations:
      required: true
